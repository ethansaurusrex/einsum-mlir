config.suffixes.add(".py")

if not config.enable_bindings_python:
    config.unsupported = True

einsum_mlir_module_path = os.path.join(config.mlir_obj_dir, "python_packages")
python_executable = config.environment.get("PYTHON", "python3")

# Define a substitution command that:
# 1. Prints the current sys.path (for debugging).
# 2. Inserts the required path.
# 3. Runs the test script.
python_cmd = (
    f'{python_executable} -c "import sys; print(\\"PYTHONPATH (in test):\\", sys.path); '
    f'sys.path.insert(0, \\"{einsum_mlir_module_path}\\"); '
    'import runpy; runpy.run_path(sys.argv[1], run_name=\\"__main__\\")" --'
)

# Use this for all Python tests
config.substitutions.append(("%python", python_cmd))
